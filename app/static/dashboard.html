<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Controle de Gastos Pessoais — Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      background: #898989;
      color: #1f2933;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 1.75rem 2rem 2.25rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 1.4rem;
    }
    .saldo {
      display: flex;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .saldo div {
      background: #f4f6f8;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      text-align: center;
    }
    .saldo span {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
    }
    #mensagem {
      color: #7b8794;
      font-size: 0.9rem;
    }
    .cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
    }
    #botao-nova-transacao {
      background: #4c6ef5;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }
    #form-transacao {
      background: #f4f6f8;
      border-radius: 8px;
      padding: 1.25rem;
      margin: 1rem 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
    }
    #form-transacao[hidden] {
      display: none;
    }
    #form-transacao label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #52606d;
      gap: 0.25rem;
    }
    #form-transacao label.linha-toda {
      grid-column: 1 / -1;
    }
    #form-transacao input,
    #form-transacao select {
      font: inherit;
      padding: 0.4rem 0.5rem;
      border: 1px solid #cbd2d9;
      border-radius: 4px;
    }
    #form-transacao .acoes {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    #erro-transacao {
      color: #c92a2a;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cabecalho">
      <h1>Dashboard — Controle de Gastos Pessoais</h1>
      <button type="button" id="botao-nova-transacao">+ Nova transação</button>
    </div>

    <form id="form-transacao" hidden>
      <label>Data
        <input type="date" name="data" required>
      </label>
      <label>Valor
        <input type="number" name="valor" step="0.01" min="0.01" required>
      </label>
      <label>Tipo
        <select name="tipo" required>
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
      </label>
      <label>Categoria
        <select name="categoria_id">
          <option value="">Sem categoria</option>
        </select>
      </label>
      <label class="linha-toda">Descrição
        <input type="text" name="descricao" required>
      </label>
      <div class="acoes">
        <button type="submit">Salvar</button>
        <span id="erro-transacao"></span>
      </div>
    </form>

    <div class="saldo">
      <div>Entradas<span id="entradas">—</span></div>
      <div>Saídas<span id="saidas">—</span></div>
      <div>Saldo<span id="saldo">—</span></div>
    </div>

    <h2>Gastos por categoria (mês atual)</h2>
    <p id="mensagem"></p>
    <canvas id="grafico-categorias" width="640" height="360"></canvas>
  </div>

  <script>
    let grafico = null;

    async function carregarSaldo() {
      const resposta = await fetch('/saldo');
      const dados = await resposta.json();
      document.getElementById('entradas').textContent = dados.entradas.toFixed(2);
      document.getElementById('saidas').textContent = dados.saidas.toFixed(2);
      document.getElementById('saldo').textContent = dados.saldo.toFixed(2);
    }

    async function carregarGastosPorCategoria() {
      const mesAtual = new Date().toISOString().slice(0, 7);
      const resposta = await fetch(`/resumo?mes=${mesAtual}`);
      const dados = await resposta.json();

      if (grafico) {
        grafico.destroy();
        grafico = null;
      }

      if (!dados.por_categoria || dados.por_categoria.length === 0) {
        document.getElementById('mensagem').textContent = `Sem gastos por categoria em ${mesAtual}.`;
        return;
      }
      document.getElementById('mensagem').textContent = '';

      const contexto = document.getElementById('grafico-categorias').getContext('2d');
      grafico = new Chart(contexto, {
        type: 'bar',
        data: {
          labels: dados.por_categoria.map((item) => item.categoria),
          datasets: [{
            label: `Gastos por categoria — ${mesAtual}`,
            data: dados.por_categoria.map((item) => item.total),
            backgroundColor: '#4c6ef5',
          }],
        },
        options: {
          responsive: false,
          plugins: { legend: { display: false } },
        },
      });
    }

    async function carregarCategorias() {
      const resposta = await fetch('/categorias');
      const categorias = await resposta.json();
      const select = document.querySelector('#form-transacao select[name="categoria_id"]');
      for (const categoria of categorias) {
        const opcao = document.createElement('option');
        opcao.value = categoria.id;
        opcao.textContent = categoria.nome;
        select.appendChild(opcao);
      }
    }

    const botaoNovaTransacao = document.getElementById('botao-nova-transacao');
    const formTransacao = document.getElementById('form-transacao');
    const erroTransacao = document.getElementById('erro-transacao');

    botaoNovaTransacao.addEventListener('click', () => {
      formTransacao.hidden = !formTransacao.hidden;
      erroTransacao.textContent = '';
    });

    formTransacao.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      erroTransacao.textContent = '';

      const dados = new FormData(formTransacao);
      const corpo = {
        data: dados.get('data'),
        descricao: dados.get('descricao'),
        valor: Number(dados.get('valor')),
        tipo: dados.get('tipo'),
        categoria_id: dados.get('categoria_id') ? Number(dados.get('categoria_id')) : null,
      };

      const resposta = await fetch('/transacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo),
      });

      if (!resposta.ok) {
        const erro = await resposta.json();
        erroTransacao.textContent = erro.erro || 'Não foi possível salvar a transação.';
        return;
      }

      formTransacao.reset();
      formTransacao.hidden = true;
      await Promise.all([carregarSaldo(), carregarGastosPorCategoria()]);
    });

    carregarSaldo();
    carregarGastosPorCategoria();
    carregarCategorias();
  </script>
</body>
</html>
